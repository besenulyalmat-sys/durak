<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Дурак: Старшая карта</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f3efe6;--fg:#1d1a17;--card:#fff;--muted:#6b6154;--line:#d8cdb8;--acc:#7a3cff;--red:#d6213b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f0d17;--fg:#efe9ff;--card:#1c1830;--muted:#9a90b8;--line:#342d52}}
:root[data-theme="dark"]{--bg:#0f0d17;--fg:#efe9ff;--card:#1c1830;--muted:#9a90b8;--line:#342d52}
html{scroll-padding-top:env(safe-area-inset-top,0px);color-scheme:light dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:14px}
h1{font-size:28px;margin:6px 0;letter-spacing:-1px}
.tag{font-size:13px;color:var(--muted)}
input{width:100%;padding:13px;border:2px solid var(--line);border-radius:12px;font:inherit;background:var(--card);color:var(--fg);margin:5px 0}
button.b{font:inherit;font-weight:700;border:0;border-radius:12px;padding:13px;background:var(--acc);color:#fff;width:100%;margin:5px 0;cursor:pointer}
button.b.alt{background:var(--card);color:var(--fg);border:2px solid var(--line)}
button.b.on{outline:3px solid var(--acc)}
.suits{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.suits .b{font-size:24px;padding:10px}
.card{display:inline-flex;flex-direction:column;justify-content:space-between;width:60px;height:88px;border-radius:9px;border:2px solid var(--line);padding:4px 5px;font-weight:800;font-size:18px;line-height:1;color:#1d1a17;background:#fbf8f0;position:relative;flex:none;font-family:inherit;text-align:left;transition:transform .15s}
.card.r{color:var(--red)}.card i{font-style:normal;font-size:24px;align-self:center}
.card small{font-size:8px;font-weight:700;line-height:1.05;color:#4b2bb8;min-height:18px}
.card.ab{border-color:var(--c);background:linear-gradient(120deg,#fbf8f0 0%,var(--c2) 40%,#fbf8f0 70%,var(--c2) 100%);background-size:250% 250%;animation:holo 3s linear infinite;box-shadow:0 0 calc(var(--t)*6px) var(--c)}
.card.t3{animation-duration:1.3s}
.s0{--c:#6b7c93;--c2:#cfd8e6}.s1{--c:#ff3b6b;--c2:#ffd0dc}.s2{--c:#e8b100;--c2:#fff0b3}.s3{--c:#2aa84a;--c2:#c8f0cf}
.t1{--t:1}.t2{--t:2}.t3{--t:3}
@keyframes holo{to{background-position:250% 0}}
.hand{display:flex;gap:6px;overflow-x:auto;padding:16px 2px 8px}
.hand .card{cursor:pointer}.card.sel{transform:translateY(-14px);outline:3px solid var(--acc)}
.table{display:flex;flex-wrap:wrap;gap:10px;min-height:112px;padding:10px;border:2px dashed var(--line);border-radius:14px;margin:8px 0}
.pair{position:relative;width:66px;height:100px}
.pair .card:nth-child(2){position:absolute;left:14px;top:12px;transform:rotate(8deg)}
.plist{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:6px;margin:8px 0}
.pl{border:2px solid var(--line);border-radius:10px;padding:6px 8px;font-size:13px;background:var(--card)}
.pl.at{border-color:#ff7a00}.pl.df{border-color:var(--acc)}.pl.out{opacity:.4}
.pill{background:var(--acc);color:#fff;border-radius:99px;padding:2px 10px;font-size:13px;font-weight:700}
details{margin:8px 0;font-size:13px;color:var(--muted)}
#fx{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;z-index:50;text-align:center;padding:20px;animation:fx 1.8s ease-out forwards;background:radial-gradient(circle,#a56bffcc,#00000088)}
#fx b{font-size:30px;color:#fff;text-shadow:0 0 20px #fff}#fx span{color:#fff;font-size:17px;margin-top:6px}
#fx.t1 b{font-size:24px}#fx.t2 b{font-size:34px}#fx.t3 b{font-size:46px}
#fx.s0{background:radial-gradient(circle,#8fa3bfcc,#000000aa)}#fx.s1{background:radial-gradient(circle,#ff3b6bcc,#400010aa)}#fx.s2{background:radial-gradient(circle,#ffd23fcc,#403000aa)}#fx.s3{background:radial-gradient(circle,#2fd05acc,#003010aa)}
#fx .pt{position:absolute;font-style:normal;font-size:26px;animation-duration:1.6s;animation-fill-mode:forwards;animation-timing-function:ease-out}
#fx .pt.u{bottom:-20px;animation-name:fu}#fx .pt.d{top:-30px;animation-name:fdn}#fx .pt.s{left:-40px;animation-name:fsd}#fx .pt.r{animation-name:fr;font-size:44px}
@keyframes fu{to{transform:translate(var(--dx),-110vh) rotate(360deg);opacity:0}}
@keyframes fdn{to{transform:translate(var(--dx),110vh) rotate(180deg);opacity:0}}
@keyframes fsd{to{transform:translate(110vw,var(--dx)) rotate(360deg);opacity:0}}
@keyframes fr{0%{transform:scale(.3) rotate(0)}60%{opacity:1}to{transform:scale(2.2) rotate(720deg);opacity:0}}
#fx .big{font-style:normal;font-size:84px;animation:pop 1s ease-out}#fx.t3 .big{font-size:120px}
@keyframes pop{0%{transform:scale(.2);opacity:0}40%{transform:scale(1.3);opacity:1}100%{transform:scale(1)}}
.copy{display:flex;gap:6px}.copy input{margin:5px 0}.copy button{width:auto;padding:0 16px;margin:5px 0}
@keyframes fx{0%{opacity:0;transform:scale(.6)}15%{opacity:1;transform:scale(1.1)}80%{opacity:1}100%{opacity:0;transform:scale(1.2)}}
.shake{animation:sh .5s}@keyframes sh{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.err{color:var(--red);font-weight:600}
</style>
</head>
<body>
<main id="app"></main>
<script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script>
<script>

const SY=['♠','♥','♦','♣'],SN=['Пики','Черви','Бубны','Трефы'],RK=['2','3','4','5','6','7','8','9','10','В','Д','К','Т'];
const DESC={dr:'сбрасываешь младшую карту',d2r:'сбрасываешь 2 младшие',gv:'младшая карта уходит следующему',gl:'младшая карта уходит предыдущему',gr:'младшая карта уходит случайному',ga:'каждому по младшей карте',pn:'соперник берёт +1',pm:'соперник берёт +2',pr:'случайный берёт +1',pa:'все берут +1',bo:'у соперника сгорает сильнейшая карта',br:'у случайного сгорает сильнейшая',b2:'у соперника сгорают 2 сильные',ba:'у всех сгорает сильнейшая',fz:'отбиться нельзя',sk:'ты ходишь снова',rv:'смена направления хода',sw:'обмен руками с соперником',tr:'козырь меняется на эту масть',lk:'способности выключены до конца раунда',ch:'+1 заряд'};
const RAW=[['pn|Нео Нью Намбу','dr|Клинок-дублёр','bo|Рикошет','pn+dr|Стальной занавес','br|Шальная пуля','pm|Огненный выстрел','b2|Залп','gv+bo|Патронташ','ba|Град пуль','fz|Копьё','fz+bo|Любовь и мир','sk+ba|Замок-темница','tr+ba+pa|Королевский арсенал'],
['dr+ch|Пластик','ch|Второе дыхание','gv|Заживление','d2r|Калорийный максимум','gl|Эластичный щит','gr|Прилив крови','pr|Яд в крови','gv+ch|Донорство','rv|Метаморфоза','pa|Эпидемия','fz+gl|Гипноз','sw|Обмен телами','ga+ch|Бессмертие'],
['dr+gr|Счастливый случай','gv+pn|Мраморный грохот','d2r+gv|Мим времени','bo+dr|Золотое прикосновение','gl+pn|Ставка','pm+dr|Обмен валюты','br+gv|Налог','rv+dr|Откат','sk|Перемотка','lk|Высокое благо','sw+pn|Балор','sk+pm|День получки','tr+sw|Революция'],
['dr+br|Росток','gr+pn|Зелень','gl+dr|Круши и ломай','ch+pn|Корни','pr+dr|Град','gv+pr|Лоза','d2r+pn|Урожай','b2+dr|Кружащийся клинок','ba+ch|Миллион вольт','rv+pn|Ветер перемен','lk+pn|Заморозки','fz+pr|Буря','ga+tr|Гнев природы']];
const ABIL=RAW.map(a=>a.map(s=>s.split('|')));
const dsc=e=>e.split('+').map(t=>DESC[t]).join(' · ');
const PT=[['⚔️','💥','🔩'],['❤️','✨','💗'],['💎','⏳','🪙'],['🌿','⚡','🍃']];
const tier=r=>r<4?1:r<9?2:3;
const $=document.getElementById('app');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rnd=n=>Math.floor(Math.random()*n);

let S=null,lastG=null,selSu=1,seenFx=-1,curGid=0,sel=null,myIdx=-1,err='',code='',myName='',peer=null,hostConn=null,isHost=false,LB=[],LN=[];
const MAXP=8,PREF='rzkdurak-';
const TV={dr:['💨','🗑️'],d2r:['💨','🗑️'],gv:['✉️','🃏'],gl:['✉️','🃏'],gr:['🎁','🃏'],ga:['🎁','🎁'],pn:['🃏','⬇️'],pm:['🃏','🃏'],pr:['🃏','🎯'],pa:['🃏','☠️'],bo:['🔥','💥'],br:['🔥','🎯'],b2:['🔥','🔥'],ba:['🔥','☄️'],fz:['⛓️','🔒'],sk:['⏩','⏱️'],rv:['🔄','🌀'],sw:['🔀','🤝'],tr:['👑','🌈'],lk:['❄️','🔇'],ch:['⚡','🔋']};
const MV={dr:'u',d2r:'u',gv:'s',gl:'s',gr:'s',ga:'s',pn:'d',pm:'d',pr:'d',pa:'d',bo:'u',br:'u',b2:'u',ba:'u',fz:'d',sk:'s',rv:'r',sw:'s',tr:'u',lk:'d',ch:'u'};
const cl=()=>location.hash.slice(1).toLowerCase().replace(/[^a-z0-9]/g,'');
const link=()=>location.href.split('#')[0]+'#'+code;
const getName=()=>{const n=document.getElementById('nm');return n?n.value.trim().slice(0,16):myName};
const su=c=>Math.floor(c/13),rk=c=>c%13;
const beats=(a,d,tr)=>(su(a)===su(d)&&rk(d)>rk(a))||(su(d)===tr&&su(a)!==tr);
const alive=(i,g=S)=>!g.out.includes(i);
function nxt(p,d,g=S){d=d||g.dr;let q=p;do{q=(q+d+g.n)%g.n}while(!alive(q,g)&&q!==p);return q}
const val=c=>rk(c)+(su(c)===S.tr?20:0);
const low=p=>S.h[p].length?S.h[p].reduce((a,b)=>val(b)<val(a)?b:a):-1;
const high=p=>S.h[p].length?S.h[p].reduce((a,b)=>val(b)>val(a)?b:a):-1;
const rem=(p,c)=>{S.h[p]=S.h[p].filter(x=>x!==c)};
function giveTo(p,q){const c=low(p);if(c<0||q===p)return;rem(p,c);S.h[q].push(c)}
function dump(p,n){while(n--){const c=low(p);if(c<0)break;rem(p,c)}}
function burn(q,n){while(n--){const c=high(q);if(c<0)break;rem(q,c)}}
function drw(q,n){while(n--&&S.dk.length)S.h[q].push(S.dk.pop())}
function trig(p,c){if(S.su!==su(c)||S.lk)return;const a=ABIL[S.su][rk(c)],k=tier(rk(c)),nf=(S.fx?S.fx.n:0)+1;
 if(k===3){if(S.ch[p]<1){S.fx={n:nf,t:S.nm[p]+' · '+a[1],d:'нет заряда ⚡',s:S.su,k:1,e:''};return}S.ch[p]--}
 const D=nxt(S.at),o=p===D?S.at:D,ot=[...Array(S.n).keys()].filter(i=>alive(i)&&i!==p),R=ot[rnd(ot.length)];
 for(const t of a[0].split('+')){
  if(t==='dr')dump(p,1);else if(t==='d2r')dump(p,2);
  else if(t==='gv')giveTo(p,nxt(p));else if(t==='gl')giveTo(p,nxt(p,-S.dr));else if(t==='gr'&&R!==undefined)giveTo(p,R);else if(t==='ga')ot.forEach(q=>giveTo(p,q));
  else if(t==='pn')drw(o,1);else if(t==='pm')drw(o,2);else if(t==='pr'&&R!==undefined)drw(R,1);else if(t==='pa')ot.forEach(q=>drw(q,1));
  else if(t==='bo')burn(o,1);else if(t==='br'&&R!==undefined)burn(R,1);else if(t==='b2')burn(o,2);else if(t==='ba')ot.forEach(q=>burn(q,1));
  else if(t==='fz'){if(p===S.at)S.fz=true}else if(t==='sk')S.sk=p;else if(t==='rv')S.dr=-S.dr;
  else if(t==='sw')[S.h[p],S.h[o]]=[S.h[o],S.h[p]];else if(t==='tr')S.tr=su(c);else if(t==='lk')S.lk=true;else if(t==='ch')S.ch[p]=Math.min(3,S.ch[p]+1)}
 S.fx={n:nf,t:S.nm[p]+' · '+a[1],d:dsc(a[0]),s:S.su,k:k,e:a[0]}}
function endRound(nx){S.tb=[];const ord=[];let q=S.at;do{ord.push(q);q=nxt(q)}while(q!==S.at&&ord.length<S.n);
 if(ord.length>2)ord.push(ord.splice(1,1)[0]);
 for(const i of ord)while(S.h[i].length<6&&S.dk.length)S.h[i].push(S.dk.pop());
 S.cr++;if(S.cr%2===0)S.ch=S.ch.map(x=>Math.min(3,x+1));
 const sk=S.sk;S.fz=false;S.sk=-1;S.lk=false;S.bk=null;S.lm=-1;
 if(!S.dk.length)for(let i=0;i<S.n;i++)if(alive(i)&&!S.h[i].length)S.out.push(i);
 const al=[...Array(S.n).keys()].filter(i=>alive(i));
 if(al.length<=1){S.ph='over';S.lz=al.length?al[0]:-1;return}
 let a=sk>=0&&alive(sk)?sk:nx;if(!alive(a))a=nxt(a);S.at=a}
function apply(p,m){if(!S||S.ph!=='play'||!alive(p))return;const D=nxt(S.at),H=S.h;
 if(m.t==='atk'){if(!H[p].includes(m.c)||p===D)return;
  if(!S.tb.length){if(p!==S.at)return}else if(!S.tb.some(x=>rk(x[0])===rk(m.c)||(x[1]>=0&&rk(x[1])===rk(m.c))))return;
  if(S.tb.length>=6||S.tb.filter(x=>x[1]<0).length>=H[D].length)return;
  const bk=JSON.stringify({...S,bk:null});rem(p,m.c);S.tb.push([m.c,-1]);trig(p,m.c);S.bk=JSON.parse(bk);S.lm=p}
 else if(m.t==='def'){if(p!==D||S.fz||!H[p].includes(m.c))return;const k=S.tb.findIndex(x=>x[1]<0);
  if(k<0||!beats(S.tb[k][0],m.c,S.tr))return;const bk=JSON.stringify({...S,bk:null});rem(p,m.c);S.tb[k][1]=m.c;trig(p,m.c);S.bk=JSON.parse(bk);S.lm=p}
 else if(m.t==='take'){if(p!==D||!S.tb.length)return;H[p].push(...S.tb.flat().filter(x=>x>=0));endRound(nxt(D))}
 else if(m.t==='done'){if(p!==S.at||!S.tb.length||S.tb.some(x=>x[1]<0))return;endRound(D)}
 else if(m.t==='undo'){if(S.lm!==p||!S.bk)return;const f=S.fx;S=S.bk;S.fx=f;S.bk=null;S.lm=-1}
 pub()}

function start(){const ps=LB.slice(0,MAXP),n=ps.length,d=[...Array(52).keys()];for(let i=51;i>0;i--){const j=rnd(i+1);[d[i],d[j]]=[d[j],d[i]]}
 LB.forEach(e=>e.idx=-1);ps.forEach((e,i)=>e.idx=i);
 S={gid:Date.now(),ph:'play',su:selSu,tr:su(d[0]),dk:d,n,nm:ps.map(e=>e.name),h:Array.from({length:n},()=>[]),tb:[],at:rnd(n),dr:1,ch:Array(n).fill(1),cr:0,out:[],lv:[],fz:false,sk:-1,lk:false,lm:-1,bk:null,fx:null,lz:-1};
 for(let i=0;i<n;i++)S.h[i]=S.dk.splice(-6);sel=null;pub()}
function V(i){return {...S,you:i,dk:Array(S.dk.length).fill(0),h:S.h.map((x,j)=>j===i?x:Array(x.length).fill(-1)),bk:!!S.bk}}
function pub(){for(const e of LB){const v=V(e.idx);if(e.c)e.c.send({t:'view',g:v});else render(v)}}
function bLobby(){LN=LB.map(e=>e.name);for(const e of LB)if(e.c)e.c.send({t:'lobby',names:LN});if(!S||S.ph==='over'&&false)draw(null)}
function hostGame(){peer=new Peer(PREF+code);
 peer.on('open',()=>{isHost=true;LB=[{c:null,name:myName,idx:0}];S=null;lastG=null;bLobby();draw(null)});
 peer.on('error',e=>{err=e.type==='unavailable-id'?'Этот код уже занят, попробуй ещё раз.':'Ошибка сети: '+e.type;home()});
 peer.on('connection',c=>{c.on('data',d=>hostMsg(c,d));c.on('close',()=>drop(c));c.on('error',()=>drop(c))})}
function hostMsg(c,d){if(!d)return;
 if(d.t==='hello'){let e=LB.find(x=>x.c===c);if(!e){e={c,name:String(d.name||'Игрок').slice(0,16),idx:-1};LB.push(e)}bLobby();if(S)c.send({t:'view',g:V(-1)});else draw(null)}
 else if(d.t==='mv'&&S){const e=LB.find(x=>x.c===c);if(e&&e.idx>=0)apply(e.idx,d.m)}}
function drop(c){const k=LB.findIndex(x=>x.c===c);if(k<0)return;const e=LB.splice(k,1)[0];
 if(S&&e.idx>=0&&S.ph==='play'&&alive(e.idx)){const i=e.idx;S.out.push(i);S.lv.push(i);S.h[i]=[];S.tb=[];S.fz=false;S.bk=null;S.lm=-1;
  const al=[...Array(S.n).keys()].filter(j=>alive(j));if(al.length<=1){S.ph='over';S.lz=al.length?al[0]:-1}else if(!alive(S.at))S.at=nxt(S.at);pub()}
 else if(!S||S.ph==='over')bLobby();if(!S)draw(null)}
function joinGame(){peer=new Peer();
 peer.on('open',()=>{hostConn=peer.connect(PREF+code,{reliable:true});hostConn.on('open',()=>hostConn.send({t:'hello',name:myName}));hostConn.on('data',guestMsg);hostConn.on('close',()=>{err='Связь с хостом потеряна.';home()})});
 peer.on('error',e=>{err=e.type==='peer-unavailable'?'Комната не найдена. Хост должен быть в игре, проверь ссылку.':'Ошибка сети: '+e.type;home()})}
function guestMsg(d){if(!d)return;if(d.t==='lobby'){LN=d.names;if(!lastG)draw(null)}else if(d.t==='view')render(d.g)}
function create(){myName=getName();if(!myName){err='Введи имя.';return home()}code=Math.random().toString(36).slice(2,7);err='Создаю комнату…';home();history.replaceState(null,'','#'+code);hostGame()}
function join(){myName=getName();code=cl();if(!myName||!code){err='Нужно имя и ссылка с кодом комнаты.';return home()}err='Подключаюсь…';home();joinGame()}
function send(m){if(isHost)apply(0,m);else if(hostConn)hostConn.send({t:'mv',m})}
function copyLink(){try{navigator.clipboard.writeText(link()).then(()=>{document.getElementById('cp').textContent='Скопировано ✅'})}catch(e){document.getElementById('lk').select()}}
function render(g){lastG=g;if(g.gid!==curGid){curGid=g.gid;seenFx=g.fx?g.fx.n:0}else if(g.fx&&g.fx.n!==seenFx){seenFx=g.fx.n;showFx(g.fx)}draw(g)}
function showFx(f){const d=document.createElement('div');d.id='fx';d.className='s'+f.s+' t'+f.k;
 const tk=f.e?f.e.split('+'):[],ic=tk.flatMap(t=>TV[t]||[]),pool=ic.length?ic:PT[f.s];
 d.innerHTML=`<i class="big">${pool[0]}</i><b>${esc(f.t)}</b><span>${esc(f.d)}</span>`;
 for(let i=0;i<f.k*7;i++){const q=document.createElement('i'),m=tk.length?MV[tk[i%tk.length]]||'u':'u';q.className='pt '+m;q.textContent=pool[i%pool.length];
  q.style.cssText=m==='s'?`top:${rnd(85)}%;--dx:${rnd(80)-40}px;animation-delay:${rnd(5)/10}s`:m==='r'?`left:${20+rnd(60)}%;top:${20+rnd(50)}%;animation-delay:${rnd(5)/10}s`:`left:${rnd(95)}%;--dx:${rnd(120)-60}px;animation-delay:${rnd(5)/10}s`;d.appendChild(q)}
 document.body.appendChild(d);if(f.k>1)$.classList.add('shake');setTimeout(()=>{d.remove();$.classList.remove('shake')},1900)}
function card(c,g,cls,click){const a=g.su===su(c)&&ABIL[g.su][rk(c)],k=tier(rk(c)),red=su(c)===1||su(c)===2,tg=click?'button':'div';
 return `<${tg} class="card ${red?'r':''} ${a?'ab s'+g.su+' t'+k:''} ${cls||''}" ${click?`onclick="act(${c})"`:''}>${RK[rk(c)]}<i>${SY[su(c)]}</i><small>${a?(k===3?'⚡':'')+esc(a[1]):''}</small></${tg}>`}

function act(c){const g=lastG;if(sel!==c){sel=c;return draw(g)}sel=null;send({t:myIdx===nxt(g.at,g.dr,g)?'def':'atk',c});draw(lastG)}
function home(){const hc=cl();
 $.innerHTML=`<h1>🃏 Дурак: Старшая карта</h1><p class="tag">Дурак на 52 карты для 2–8 игроков. Одна масть получает способности. Игра идёт напрямую между браузерами.</p>
 <input id="nm" maxlength="16" placeholder="Твоё имя" value="${esc(myName)}">${hc?`<button class="b" onclick="join()">Войти в комнату ${esc(hc)}</button>`:''}
 <button class="b ${hc?'alt':''}" onclick="create()">Создать новую комнату</button><p class="err">${esc(err)}</p>`}
function draw(g){
 const mi=g?g.you:-1;myIdx=mi;let h='';
 if(!g){
  h+=`<h1>Комната ${esc(code)}</h1><p class="tag">Отправь друзьям эту ссылку. Играют первые ${MAXP}, остальные смотрят.</p>
  <div class="copy"><input id="lk" readonly value="${esc(link())}" onclick="this.select()"><button class="b" id="cp" onclick="copyLink()">Копировать</button></div>
  <div class="plist">${(isHost?LB.map(e=>e.name):LN).map((n,i)=>`<div class="pl">${i<MAXP?'':'👀 '}${esc(n)}${i===0?' 👑':''}</div>`).join('')}</div>`;
  if(isHost&&LB.length>=2){h+=`<p><b>Масть со способностями:</b></p><div class="suits">${SY.map((s,i)=>`<button class="b alt ${selSu===i?'on':''}" onclick="selSu=${i};draw(null)">${s}</button>`).join('')}</div>
  <details><summary>Способности ${SY[selSu]} ${SN[selSu]}</summary>${ABIL[selSu].map((a,i)=>`${RK[i]}${SY[selSu]} ${i>8?'⚡':''}<b>${esc(a[1])}</b>: ${dsc(a[0])}`).join('<br>')}</details><button class="b" onclick="start()">Начать игру</button>`}
  else if(isHost)h+=`<p class="tag">Ждём хотя бы одного игрока…</p>`;else h+=`<p class="tag">Ждём, пока хост начнёт игру.</p>`;
  return $.innerHTML=h}
 const D=nxt(g.at,g.dr,g);
 h+=`<div class="plist">${g.nm.map((n,i)=>`<div class="pl ${i===g.at?'at':''} ${i===D?'df':''} ${g.out.includes(i)?'out':''}">${g.ph==='play'&&i===g.at?'⚔️ ':g.ph==='play'&&i===D?'🛡 ':''}${esc(n)}${i===mi?' (ты)':''}${g.lv.includes(i)?' (вышел)':''}<br><b>${g.h[i].length}</b> 🃏 · ⚡${g.ch[i]}</div>`).join('')}</div>
 <div class="tag">Колода: <b>${g.dk.length}</b> · козырь ${SY[g.tr]} · ход ${g.dr>0?'↻':'↺'} · способности: ${SY[g.su]} ${SN[g.su]}${g.lk?' · 🔇 тишина':''}${mi<0?' · 👀 ты зритель':''}</div>`;
 h+=`<div class="table">${g.tb.length?g.tb.map(([a,d])=>`<div class="pair">${card(a,g)}${d>=0?card(d,g):''}</div>`).join(''):'<span class="tag">Стол пуст</span>'}</div>`;
 if(g.ph==='over'){h+=`<h1>${g.lz>=0?'🤡 Дурак: '+esc(g.nm[g.lz]):'Ничья!'}</h1><p>${g.out.filter(i=>!g.lv.includes(i)).map((i,k)=>(k+1)+'. '+esc(g.nm[i])).join('<br>')}</p>`;if(isHost)h+=`<button class="b" onclick="start()">Новая партия</button>`}
 else{h+=`<p>Атакует: <span class="pill">${esc(g.nm[g.at])}</span> → защищается: <span class="pill">${esc(g.nm[D])}</span></p>`;
  if(mi>=0&&mi===g.at&&g.tb.length&&g.tb.every(x=>x[1]>=0))h+=`<button class="b" onclick="send({t:'done'})">Бито</button>`;
  if(mi>=0&&mi===D&&g.tb.some(x=>x[1]<0))h+=`<button class="b alt" onclick="send({t:'take'})">Взять карты</button>`;
  if(g.fz&&mi===D)h+='<p class="err">Отбиться нельзя, только взять!</p>';
  if(mi>=0&&g.lm===mi&&g.bk)h+=`<button class="b alt" onclick="send({t:'undo'})">↩ Вернуть карту</button>`}
 const hand=mi>=0?g.h[mi].slice().sort((a,b)=>a-b):[],can=mi>=0&&g.ph==='play'&&alive(mi,g)&&(mi===D?g.tb.length>0:(mi===g.at||g.tb.length>0));
 if(mi>=0)h+=`<div class="hand">${hand.map(c=>card(c,g,c===sel?'sel':'',can)).join('')}</div>`;
 if(can&&sel!==null&&hand.includes(sel)){const a=g.su===su(sel)&&ABIL[g.su][rk(sel)];h+=`<p class="tag">Нажми ещё раз на карту, чтобы сыграть.${a?`<br><b>${esc(a[1])}</b>: ${dsc(a[0])}${tier(rk(sel))===3?' (нужен ⚡)':''}`:''}</p>`}
 else if(can)h+=`<p class="tag">Нажми на карту, чтобы выбрать, и ещё раз, чтобы сыграть.</p>`;
 $.innerHTML=h}
home();
