<style>

button,.card{touch-action:manipulation;cursor:pointer}
.hand{display:flex;flex-wrap:wrap;gap:8px;padding:10px 2px;overflow:visible}

.pair{width:88px;height:118px}.table .card{width:70px;height:100px;font-size:21px}.pair .card:nth-child(2){position:absolute;left:18px;top:16px;transform:rotate(8deg)}

.card.tp{border-color:#22c55e;box-shadow:0 0 12px #22c55e}
.card.ab{border-color:var(--c);box-shadow:0 0 calc(var(--t)*6px) var(--c)}

#bar{display:flex;justify-content:flex-end;gap:6px;padding:8px 14px 0;max-width:560px;margin:0 auto}
#bar button{font-size:20px;padding:6px 12px;border:2px solid var(--line);border-radius:10px;background:var(--card);color:var(--fg);cursor:pointer}#bar button.on{border-color:#22c55e;box-shadow:0 0 8px #22c55e}
#banner{display:none;background:#f59e0b;color:#1d1a17;font-weight:700;text-align:center;padding:8px}

#help .box{background:var(--bg);color:var(--fg);border-radius:16px;padding:18px;max-width:460px;max-height:88vh;overflow-y:auto;font-size:15px}#help li{margin:6px 0}
#chatbox{display:none;position:fixed;right:12px;bottom:14px;z-index:40}
#react{width:52px;height:52px;border-radius:50%;border:0;background:var(--acc);font-size:26px;box-shadow:0 4px 14px #0005;cursor:pointer;opacity:.92}

#stk button{font-size:28px;padding:6px 8px;border:0;background:none;cursor:pointer}
main{padding-bottom:84px}
.acts{display:flex;gap:8px;margin:8px 0}.acts .b{flex:1;margin:0}
.mid{text-align:center;margin:8px 0}.last{margin-top:8px}
.card{box-shadow:0 1px 4px #0003}
</style>

<div id="bar"><button onclick="showHelp()" title="Правила">❓</button><button id="sndb" onclick="togSnd()" title="Звук">🔊</button><button id="micb" onclick="togMic()" title="Голосовая связь">🎤</button></div>

<script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script>
<script>

const SY=['♠','♥','♦','♣'],SN=['Пики','Черви','Бубны','Трефы'],RK=['2','3','4','5','6','7','8','9','10','В','Д','К','Т'];
const DESC={dr:'сбрасываешь младшую карту',gv:'младшая карта уходит следующему',ga:'каждому по младшей карте',pn:'соперник берёт +1',pa:'все берут +1',bo:'у соперника сгорает сильнейшая карта',ba:'у всех сгорает сильнейшая',fz:'отбиться нельзя',sk:'ты ходишь снова',rv:'смена направления хода',sw:'обмен руками с соперником',tr:'козырь меняется на эту масть',lk:'способности выключены до конца раунда',ch:'+1 заряд',wd:'бьёт любую некозырную карту',rf:'атакующая карта возвращается атакующему',cap:'в раунде не больше 2 пар',ban:'соперник не может ходить своей любимой мастью',wk:'атакующая карта слабеет на 3',st:'твоя карта становится сильнее на 3',lt:'каждый отдаёт случайную карту следующему',cr:'все руки сдвигаются по кругу',eq:'карты у всех раздаются заново поровну',gm:'орёл: сброс младшей, решка: +2 карты',xc:'обмен: твоя младшая на сильнейшую соперника',rev:'две карты соперника открываются',pk:'три верхние карты колоды открываются',sh:'щит: следующий раз не берёшь карты',gy:'соперник берёт карту из сброса',ec:'повторяет прошлую способность'};
const RAW=[['pn|Нео Нью Намбу','wd|Парирование','bo|Рикошет','cap|Стальной занавес','ban|Прицел','st|Огненный выстрел','rf|Контрудар','gy|Могильщик','ba|Град пуль','fz|Копьё','fz+bo|Любовь и мир','sk+ban|Замок-темница','tr+ba|Королевский арсенал'],
['sh|Пластик','ch|Второе дыхание','gv|Заживление','lt|Калорийный максимум','rev|Диагностика','xc|Донорство','gm|Адреналин','ec|Регенерация','cr|Метаморфоза','pa|Эпидемия','fz+gv|Гипноз','sw|Обмен телами','eq+sh|Бессмертие'],
['pk|Счастливый случай','wk|Мраморный грохот','ec|Мим времени','xc|Золотое прикосновение','gm|Ставка','cr|Обмен валюты','rev|Аудит','rf|Откат','sk|Перемотка','lk|Высокое благо','rev+wk|Балор','sk+gm|День получки','tr+eq|Революция'],
['ch|Росток','st|Зелень','wk|Круши и ломай','sh|Корни','ban|Град','wd|Лоза','gv|Урожай','bo|Кружащийся клинок','ba|Миллион вольт','rv|Ветер перемен','lk|Заморозки','fz+ban|Буря','ga+tr|Гнев природы']];
const ABIL=RAW.map(a=>a.map(s=>s.split('|')));
const dsc=e=>e.split('+').map(t=>DESC[t]).join(' · ');
const PT=[['⚔️','💥','🔩'],['❤️','✨','💗'],['💎','⏳','🪙'],['🌿','⚡','🍃']];
const tier=r=>r<4?1:r<9?2:3;
const $=document.getElementById('app');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rnd=n=>Math.floor(Math.random()*n);

let S=null,lastG=null,selSu=4,seenFx=-1,curGid=0,sel=null,selS=[],myIdx=-1,wasMy=false,infoC=null,selTm=0,snd=true,micS=null,vcalls={},plist=[],snap=null,isBackup=false,retry=0,chat=[],prevTb=new Set(),lastLg='',overGid=0,skew=0,everConn=false,lostFlag=false,err='',code='',myName='',peer=null,hostConn=null,isHost=false,LB=[],LN=[];
const MAXP=8,PREF='rzkdurak-';
const TV={dr:['💨','🗑️'],gv:['✉️','🃏'],ga:['🎁','🎁'],pn:['🃏','⬇️'],pa:['🃏','☠️'],bo:['🔥','💥'],ba:['🔥','☄️'],fz:['⛓️','🔒'],sk:['⏩','⏱️'],rv:['🔄','🌀'],sw:['🔀','🤝'],tr:['👑','🌈'],lk:['❄️','🔇'],ch:['⚡','🔋'],wd:['🛡️','⚔️'],rf:['🪞','↩️'],cap:['🚧','🔢'],ban:['🚫','🎯'],wk:['📉','💧'],st:['📈','✨'],lt:['🎲','🃏'],cr:['🎠','🔄'],eq:['⚖️','🃏'],gm:['🎰','🍀'],xc:['🤝','💱'],rev:['👁️','🔍'],pk:['🔮','✨'],sh:['🛡️','💠'],gy:['⚰️','👻'],ec:['🔁','📣']};
const MV={dr:'u',gv:'s',ga:'s',pn:'d',pa:'d',bo:'u',ba:'u',fz:'d',sk:'s',rv:'r',sw:'s',tr:'u',lk:'d',ch:'u',wd:'r',rf:'s',cap:'d',ban:'d',wk:'d',st:'u',lt:'s',cr:'r',eq:'r',gm:'u',xc:'s',rev:'r',pk:'u',sh:'r',gy:'d',ec:'r'};
const cl=()=>location.hash.slice(1).toLowerCase().replace(/[^a-z0-9]/g,'');
const link=()=>location.href.split('#')[0]+'#'+code;
const getName=()=>{const n=document.getElementById('nm');return n?n.value.trim().slice(0,16):myName};
const su=c=>Math.floor(c/13),rk=c=>c%13;
const beats=(a,d,tr,b=0)=>(su(a)===su(d)&&rk(d)>rk(a)+b)||(su(d)===tr&&su(a)!==tr);
const alive=(i,g=S)=>!g.out.includes(i);
function nxt(p,d,g=S){d=d||g.dr;let q=p;do{q=(q+d+g.n)%g.n}while(!alive(q,g)&&q!==p);return q}
const val=c=>rk(c)+(su(c)===S.tr?20:0);
const low=p=>S.h[p].length?S.h[p].reduce((a,b)=>val(b)<val(a)?b:a):-1;
const high=p=>S.h[p].length?S.h[p].reduce((a,b)=>val(b)>val(a)?b:a):-1;
const rem=(p,c)=>{S.h[p]=S.h[p].filter(x=>x!==c)};
function giveTo(p,q){const c=low(p);if(c<0||q===p||S.h[p].length<2)return;rem(p,c);S.h[q].push(c)}
function dump(p,n){while(n--&&S.h[p].length>1){const c=low(p);rem(p,c);S.dc.push(c)}}
function burn(q,n){while(n--){const c=high(q);if(c<0)break;rem(q,c);S.dc.push(c)}}
function drw(q,n){while(n--&&S.dk.length)S.h[q].push(S.dk.pop())}
const wild=c=>S.su===su(c)&&!S.lk&&ABIL[S.su][rk(c)][0].split('+').includes('wd');
const tbc=()=>S.tb.flatMap(x=>[x[0],x[1]]).filter(x=>x>=0);
const cn=c=>RK[rk(c)]+SY[su(c)];
function runTok(t,x){const p=x.p,o=x.o,ot=x.ot,H=S.h;
 if(t==='dr')dump(p,1);else if(t==='gv')giveTo(p,nxt(p));else if(t==='ga')ot.forEach(q=>giveTo(p,q));
 else if(t==='pn')drw(o,1);else if(t==='pa')ot.forEach(q=>drw(q,1));
 else if(t==='bo')burn(o,1);else if(t==='ba')ot.forEach(q=>burn(q,1));
 else if(t==='fz'){if(p===S.at)S.fz=true}else if(t==='sk')S.sk=p;else if(t==='rv')S.dr=-S.dr;
 else if(t==='sw')[H[p],H[o]]=[H[o],H[p]];else if(t==='tr')S.tr=su(x.c);else if(t==='lk')S.lk=true;else if(t==='ch')S.ch[p]=Math.min(5,S.ch[p]+1);
 else if(t==='cap')S.cap=2;
 else if(t==='ban'){if(H[o].length){const n=[0,0,0,0];H[o].forEach(c=>n[su(c)]++);S.bn={s:n.indexOf(Math.max(...n)),by:p}}}
 else if(t==='wk'){const k=S.tb.findIndex(y=>y[1]<0);if(k>=0)S.tb[k][2]-=3}
 else if(t==='st'){const k=S.tb.findIndex(y=>y[0]===x.c);if(k>=0)S.tb[k][2]+=3}
 else if(t==='rf'){const k=S.tb.findIndex(y=>y[1]===x.c);if(p===nxt(S.at)&&k>=0){S.h[S.at].push(S.tb[k][0]);S.dc.push(x.c);S.tb.splice(k,1)}}
 else if(t==='lt'){const al=[...Array(S.n).keys()].filter(i=>alive(i)&&H[i].length>1),pk=al.map(i=>H[i].splice(rnd(H[i].length),1)[0]);al.forEach((i,k)=>H[nxt(i)].push(pk[k]))}
 else if(t==='cr'){const al=[...Array(S.n).keys()].filter(i=>alive(i)),old=al.map(i=>H[i]);al.forEach((i,k)=>{H[nxt(i)]=old[k]})}
 else if(t==='eq'){const al=[...Array(S.n).keys()].filter(i=>alive(i)),pool=al.flatMap(i=>H[i]);for(let i=pool.length-1;i>0;i--){const j=rnd(i+1);[pool[i],pool[j]]=[pool[j],pool[i]]}al.forEach(i=>{H[i]=[]});pool.forEach((c,k)=>H[al[k%al.length]].push(c))}
 else if(t==='gm'){if(rnd(2))dump(p,1);else drw(p,2)}
 else if(t==='xc'){const a=low(p),b=high(o);if(a>=0&&b>=0){rem(p,a);rem(o,b);H[p].push(b);H[o].push(a)}}
 else if(t==='rev'){const h=H[o].filter(c=>!S.vc[o].includes(c)).sort(()=>Math.random()-.5).slice(0,2);S.vc[o].push(...h);if(h.length)x.txt.push(S.nm[o]+': '+h.map(cn).join(', '))}
 else if(t==='pk'){const h=S.dk.slice(-3).reverse();S.pk.push(...h.filter(c=>!S.pk.includes(c)));if(h.length)x.txt.push('колода: '+h.map(cn).join(', '))}
 else if(t==='sh')S.sh[p]=true;
 else if(t==='gy'){if(S.dc.length)H[o].push(S.dc.pop())}

function card(c,g,cls,click,inf){const a=g.su===su(c)&&ABIL[g.su][rk(c)],k=tier(rk(c)),red=su(c)===1||su(c)===2,tp=su(c)===g.tr,tg=click||inf?'button':'div';
 return `<${tg} class="card ${red?'r':''} ${a?'ab s'+g.su+' t'+k:''} ${tp?'tp':''} ${cls||''}" ${click?`onclick="act(${c})"`:inf?`onclick="info(${c})"`:''}>${RK[rk(c)]}<i>${SY[su(c)]}</i><small>${a?(k===3?'⚡'+(rk(c)-8):'')+esc(a[1]):''}</small>${tp?'<b class="kb">К</b>':''}</${tg}>`}
function act(c){const g=lastG,D=nxt(g.at,g.dr,g),isDef=myIdx===D;infoC=null;
 if(selS.includes(c)){if(selS.length===1){selS=[];send({t:isDef?'def':'atk',c});return draw(lastG)}selS=selS.filter(x=>x!==c);return draw(g)}
 if(!isDef&&selS.length&&rk(selS[0])===rk(c)){selS.push(c);return draw(g)}
 selS=[c];draw(g)}
function playSel(){const cs=selS.slice();selS=[];send({t:'atkm',cs});draw(lastG)}
function info(c){infoC=infoC===c?null:c;selS=[];draw(lastG)}
function home(){const hc=cl();
 $.innerHTML=`<h1>🃏 Дурак: Старшая карта</h1><p class="tag">Дурак со способностями карт. 2–8 игроков.</p>
 <input id="nm" maxlength="16" placeholder="Твоё имя" value="${esc(myName)}">${hc?`<button class="b" onclick="join()">Войти в комнату ${esc(hc)}</button>`:''}
 <button class="b ${hc?'alt':''}" onclick="create()">Создать новую комнату</button><p class="err">${esc(err)}</p>`}
function draw(g){
 const mi=g?g.you:-1;myIdx=mi;let h='';
 if(!g){
  h+=`<h1>Комната ${esc(code)}</h1><p class="tag">Отправь ссылку друзьям.</p>
  <div class="copy"><input id="lk" readonly value="${esc(link())}" onclick="this.select()"><button class="b" id="cp" onclick="copyLink()">Копировать</button></div>
  <div class="plist">${(isHost?LB.map(e=>e.name):LN).map((n,i)=>`<div class="pl">${i<MAXP?'':'👀 '}${esc(n)}${i===0?' 👑':''}</div>`).join('')}</div>`;
  if(isHost&&LB.length>=2){h+=`<p><b>Масть со способностями:</b></p>${suBtns('draw(null)')}
  ${selSu<4?`<details><summary>Способности ${SY[selSu]} ${SN[selSu]}</summary>${ABIL[selSu].map((a,i)=>`${RK[i]}${SY[selSu]} ${i>8?'⚡'+(i-8):''}<b>${esc(a[1])}</b>: ${dsc(a[0])}`).join('<br>')}</details>`:'<p class="tag">🎲 Масть со способностями выберется случайно в начале каждой партии.</p>'}${tmBtns('draw(null)')}<button class="b" onclick="start()">Начать игру</button>`}
  else if(isHost)h+=`<p class="tag">Ждём хотя бы одного игрока…</p>`;else h+=`<p class="tag">Ждём, пока хост начнёт игру.</p>`;
  return $.innerHTML=h}
 const D=nxt(g.at,g.dr,g),play=g.ph==='play',y=window.scrollY,allDef=g.tb.length>0&&g.tb.every(x=>x[1]>=0),hasU=g.tb.some(x=>x[1]<0);
 const myAct=play&&mi>=0&&((mi===D&&!g.tk&&hasU)||(mi===g.at&&!g.tb.length));
 if(myAct&&!wasMy){sound('ding');try{navigator.vibrate&&navigator.vibrate(200)}catch(e){}}wasMy=myAct;
 const face=c=>`<span class="mf ${su(c)===1||su(c)===2?'r':''} ${su(c)===g.tr?'tp':''}">${cn(c)}</span>`;
 const mini=i=>{if(i===mi)return '';const H=g.h[i],f=H.filter(c=>c>=0),b=H.length-f.length;return `<div class="mini">${f.map(face).join('')}${'<span class="mb"></span>'.repeat(b)}</div>`};
 const open=g.dk.filter(c=>c>=0),red=g.tr===1||g.tr===2;
 h+=`<div class="info"><div class="chip">🂠 <b>${g.dk.length}</b></div><div class="chip tbx">козырь <b${red?' style="color:var(--red)"':''}>${SY[g.tr]}</b></div><div class="chip abx s${g.su}">✨ <b>${SY[g.su]}</b> ${SN[g.su]}</div>${g.tm&&g.dl&&play?'<div class="chip">⏱ <b id="tmr"></b></div>':''}${g.dr<0?'<div class="chip">↺</div>':''}${g.lk?'<div class="chip">🔇</div>':''}${g.bn?`<div class="chip">🚫 ${SY[g.bn.s]}</div>`:''}</div>${open.length?`<div class="tag">Открыты в колоде: ${open.map(face).join('')}</div>`:''}${mi<0?'<div class="tag">👀 ты зритель</div>':''}`;
 h+=`<div class="plist">${g.nm.map((n,i)=>`<div class="pl ${i===g.at?'at':''} ${i===D?'df':''} ${g.out.includes(i)?'out':''}">${play&&i===g.at?'⚔️ ':play&&i===D?'🛡 ':''}${esc(n)}${i===mi?' (ты)':''}${g.lv.includes(i)?' (вышел)':''}${(g.off||[]).includes(i)?' (нет связи)':''}${(g.ps||[]).includes(i)?' ✅':''}<br><b>${g.h[i].length}</b> 🃏 · ⚡${g.ch[i]}${mini(i)}</div>`).join('')}</div>`;
 h+=`<div class="table">${g.tb.length?g.tb.map(([a,d,b])=>`<div class="pair ${prevTb.has(a)&&(d<0||prevTb.has(d))?'':'in'}">${card(a,g,'',false,true)}${d>=0?card(d,g,'',false,true):''}${b?`<span class="pill" style="position:absolute;top:-8px;right:-6px">${b>0?'+':''}${b}</span>`:''}</div>`).join(''):'<span class="tag">Стол пуст</span>'}</div>`;
 prevTb=new Set(g.tb.flatMap(x=>[x[0],x[1]]));
 if(g.ph==='over'){h+=`<h1>${g.lz>=0?'🤡 Дурак: '+esc(g.nm[g.lz]):'Ничья!'}</h1><p>${g.out.filter(i=>!g.lv.includes(i)).map((i,k)=>(k+1)+'. '+esc(g.nm[i])).join('<br>')}</p>`;if(isHost)h+=suBtns('draw(lastG)')+tmBtns('draw(lastG)')+`<button class="b" onclick="start()">Новая партия</button>`}
 else{
  if(myAct)h+=`<div class="turn">🔔 ${mi===D?'Твой ход: отбивайся или бери':'Твой ход: атакуй'}</div>`;
  else h+=`<div class="tag mid">${!g.tb.length?'Ждём ход: '+esc(g.nm[g.at]):g.tk?esc(g.nm[D])+' берёт карты':hasU?esc(g.nm[D])+' отбивается':'Все пары отбиты'}</div>`;
  const passed=(g.ps||[]).includes(mi),acts=[];
  if(mi>=0&&mi!==D&&alive(mi,g)&&g.tb.length&&(g.tk||allDef)&&!passed)acts.push(`<button class="b" onclick="send({t:'done'})">${g.tk?'Больше не подкидываю':'Бито'}</button>`);
  if(mi===D&&!g.tk&&hasU)acts.push(`<button class="b alt" onclick="send({t:'take'})">Взять карты</button>`);
  if(mi>=0&&g.lm===mi&&g.bk)acts.push(`<button class="b alt" onclick="send({t:'undo'})">↩ Вернуть</button>`);
  if(acts.length)h+=`<div class="acts">${acts.join('')}</div>`;
  if(passed)h+=`<div class="tag mid">✅ Ты спасовал, ждём остальных…</div>`;
  if(g.fz&&mi===D&&!g.tk)h+='<div class="err mid">Отбиться нельзя, только взять!</div>'}
 const hand=mi>=0?g.h[mi].slice().sort((a,b)=>a-b):[],can=mi>=0&&play&&alive(mi,g)&&(mi===D?(!g.tk&&g.tb.length>0):(mi===g.at||g.tb.length>0));
 selS=selS.filter(c=>hand.includes(c));const pc=selS.length?selS[0]:infoC;
 if(pc===null||pc===undefined)h+=`<div class="prev"><span class="tag">Нажми на карту, чтобы увидеть её способность</span></div>`;
 else{const ab=g.su===su(pc)&&ABIL[g.su][rk(pc)];h+=`<div class="prev">${card(pc,g)}<div><b>${cn(pc)}</b>${su(pc)===g.tr?' · козырь':''}<br>${ab?`<b>${esc(ab[1])}</b>: ${dsc(ab[0])}${tier(rk(pc))===3?' · стоит ⚡'+(rk(pc)-8):''}`:'обычная карта'}${can&&selS.length===1?`<br><button class="b" onclick="act(${pc})">Сыграть</button>`:can&&selS.length>1?`<br><b>Выбрано:</b> ${selS.map(cn).join(' ')}<br><button class="b" onclick="playSel()">Сыграть все (${selS.length})</button>`:''}</div></div>`}
 if(mi>=0)h+=`<div class="hand">${hand.map(c=>card(c,g,selS.includes(c)?'sel':'',can,!can)).join('')}</div>`;
 const lgs=(g.lg||[]).slice().reverse();
 h+=`<div class="tag last">${lgs.length?esc(lgs[0]):''}</div><details><summary class="tag">Журнал</summary><div class="tag">${lgs.map(esc).join('<br>')}</div></details>`;
 $.innerHTML=h;window.scrollTo(0,y)}
home();
document.addEventListener('pointerdown',()=>ac(),{once:true});
setInterval(tickTimers,500);
try{if(!localStorage.getItem('rz_help')){showHelp();localStorage.setItem('rz_help','1')}}catch(e){}
</script>
</body>
</html>
